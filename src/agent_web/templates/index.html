<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Web</title>
    <link rel="stylesheet" href="/static/app.css?v=console-redesign">
  </head>
  <body>
    <main class="console-shell">
      <header class="topbar">
        <div class="brand-lockup"><span class="brand-mark">AW</span><div><span class="eyebrow">AGENT WEB / LOCAL CONTROL PLANE</span><h1>Agent Console</h1></div></div>
        <div class="runtime-readout"><span class="signal" aria-hidden="true"></span><span id="health">Checking agents…</span><span id="limits"></span><span id="update"></span></div>
      </header>
      {% if lan_mode %}<aside class="lan-alert"><strong>LAN mode</strong><span>Anyone on this network can control configured projects.</span></aside>{% endif %}
      <section class="project-index"><div class="section-heading"><span class="section-kicker">01 / WORKSPACES</span><h2>Projects</h2></div><div id="projects" aria-live="polite"></div></section>
      <section class="project-create"><div class="section-heading"><span class="section-kicker">02 / REGISTER</span><h2>Add a project folder</h2></div><form id="project-form"><label>Name<input name="name" placeholder="e.g. API migration" required></label><label>Folder path<input name="path" placeholder="C:\dev\project" required></label><button>Add project</button></form></section>
      <section id="chat" class="chat-workspace" hidden><div class="chat-heading"><div><span class="section-kicker">03 / ACTIVE THREAD</span><h2 id="session-title">New session</h2></div><span class="thread-state">LIVE</span></div><div id="chat-settings"></div><div id="messages" aria-live="polite"></div><form id="turn-form" class="composer"><label>Instruction<textarea name="prompt" placeholder="Describe the next task for your agent…" required></textarea></label><button>Run turn</button></form></section>
    </main>
    <script src="/static/app.js?v=console-redesign"></script>
  </body>
</html>
